sonar.projectKey=Marcobros1_brloop
sonar.organization=marcobros1

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=brloop
sonar.projectVersion=0.1.0

# Path is relative to the sonar-project.properties file.
sonar.sources=app,core,tests,tools

# Build output and the research scripts are not part of the shipped application.
sonar.exclusions=**/build/**,dist/**,research/**

# The synthetic BRSTM generator is a test-data tool: it is built and run in CI
# to produce inputs, but it is not measured or shipped, so it is left out of
# the coverage measure of the application.
sonar.coverage.exclusions=core/tests/make_synthetic_brstm.c,app/tests/player_tests.c
# player_tests.c needs the local reference collection and an audio device, so CI
# never runs it; its lines are test code, not the shipped application.

# Source files are UTF-8 (Spanish and English UI strings).
sonar.sourceEncoding=UTF-8
