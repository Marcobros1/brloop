name: CI

# Portable checks only. The full verification harness (tests/run_t2_verification.ps1)
# needs the local reference collection, vgmstream and an audio device, so it runs
# on a self-hosted Windows runner instead (see ARCHITECTURE.md, "Continuous
# integration").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history: SonarQube needs it for accurate blame and new-code detection.

      - name: Check for whitespace errors
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base (first push): checking the last commit only."
            base="HEAD~1"
          fi
          git diff --check "$base" HEAD

      - name: Build core tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File core\build.ps1

      - name: Build app and player tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1

      # Coverage for SonarQube: the window self-test runs against a synthetic
      # BRSTM (no reference collection needed) under OpenCppCoverage, which
      # exports Cobertura XML. The PDB comes from a separate debug build so that
      # app\build (the shipped binary) stays unchanged.
      - name: Install OpenCppCoverage
        shell: pwsh
        run: |
          # Instalador oficial del release 0.9.9.0 (tag release-0.9.9.0) del autor OpenCppCoverage.
          # SHA-256 verificado contra la descarga de:
          # https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe
          $url = 'https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe'
          $expectedHash = '2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888'
          $installer = Join-Path $env:TEMP 'OpenCppCoverageSetup-x64-0.9.9.0.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "OpenCppCoverage SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          & $installer /VERYSILENT

      - name: Measure coverage of the window self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $cov = Join-Path $root 'coverage'
          New-Item -ItemType Directory -Force -Path $cov | Out-Null

          # Debug build with PDB, same sources and flags as app\build.ps1.
          $dbg = Join-Path $cov 'debug'
          New-Item -ItemType Directory -Force -Path $dbg | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $cov 'debug.bat'
          $srcFiles = Get-Content (Join-Path $root 'app\sources.txt') | Where-Object { $_.Trim() } | ForEach-Object { '"' + (Join-Path $root $_) + '"' }
          $srcArgs = $srcFiles -join ' '
          @(
            '@echo off',
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1",
            'if errorlevel 1 exit /b 1',
            "cd /d `"$dbg`"",
            "rc /nologo /fo brloop.res `"$root\app\src\brloop.rc`"",
            "cl /nologo /W4 /WX /O2 /Zi /utf-8 /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE /I`"$root\core\include`" /I`"$root\app\include`" $srcArgs brloop.res /Fe:brloop.exe /Fd:brloop.pdb /link user32.lib gdi32.lib shell32.lib winmm.lib comctl32.lib comdlg32.lib psapi.lib uxtheme.lib advapi32.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -Path $bat -Encoding Ascii
          cmd /c "`"$bat`""
          if ($LASTEXITCODE -ne 0) { throw "debug build failed ($LASTEXITCODE)" }

          # The UI font is loaded from assets\fonts next to the executable.
          New-Item -ItemType Directory -Force -Path (Join-Path $dbg 'assets\fonts') | Out-Null
          Copy-Item -Path (Join-Path $root 'app\assets\fonts\*') -Destination (Join-Path $dbg 'assets\fonts') -Force

          # Synthetic inputs: a stereo track and a 4-channel track, plus a file that must be rejected.
          $gen = Join-Path $cov 'make_synthetic_brstm.exe'
          $genBat = Join-Path $cov 'generator.bat'
          @(
            '@echo off',
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1",
            'if errorlevel 1 exit /b 1',
            "cl /nologo /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS `"$root\core\tests\make_synthetic_brstm.c`" /Fe:`"$gen`" >nul",
            'exit /b %errorlevel%'
          ) | Set-Content -Path $genBat -Encoding Ascii
          cmd /c "`"$genBat`""
          if ($LASTEXITCODE -ne 0) { throw "generator build failed ($LASTEXITCODE)" }
          $stereo = Join-Path $cov 'stereo.brstm'
          $quad = Join-Path $cov 'quad.brstm'
          $bad = Join-Path $cov 'bad.brstm'
          & $gen $stereo 2 0 40
          & $gen $quad 4 0 40
          [IO.File]::WriteAllBytes($bad, [byte[]](0, 1, 2, 3))

          $env:MKW_SETTINGS_DIR = Join-Path $cov 'settings'
          $report = Join-Path $cov 'selftest.txt'
          $xml = Join-Path $cov 'coverage.xml'
          $oc = Join-Path $env:ProgramFiles 'OpenCppCoverage\OpenCppCoverage.exe'
          # OpenCppCoverage returns the exit code of the measured program. Under
          # $ErrorActionPreference = 'Stop' a native non-zero code would stop the
          # step before the warning below, so read the code without that rule.
          $ErrorActionPreference = 'Continue'
          & $oc --modules "$dbg*" --sources "$root\app\src*" --export_type "cobertura:$xml" -- (Join-Path $dbg 'brloop.exe') --selftest $stereo $quad --invalid $bad --report $report | Out-Null
          $selftest = $LASTEXITCODE
          Write-Host "EXIT=$selftest"
          if (Test-Path $report) {
              Get-Content $report -Tail 5
          } else {
              Write-Host 'NO REPORT'
              Get-ChildItem $cov
          }
          $ErrorActionPreference = 'Stop'
          # Print the whole report so a failing check is visible in the log.
          Get-Content $report
          # The GitHub runner has no audio device (waveOutGetNumDevs = 0), so the
          # playback checks cannot pass here. The window checks still run and the
          # coverage is still measured, so only warn; a missing report is fatal.
          if ($selftest -ne 0) { Write-Host "::warning::window self-test reported failures on this runner (no audio device); coverage still measured" }
          if (-not (Test-Path $xml)) { throw 'coverage report was not written' }
          # Finish with an explicit success: the last native command above returns
          # the measured program's exit code, which must not fail this step.
          exit 0

      # Coverage for SonarQube: the headless UI-logic tests run under
      # OpenCppCoverage, which exports Cobertura XML. No audio device is
      # involved, so a test failure fails this step.
      - name: Measure coverage of the UI logic tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $cov = Join-Path $root 'coverage'
          New-Item -ItemType Directory -Force -Path $cov | Out-Null

          $env:MKW_SETTINGS_DIR = Join-Path $cov 'settings'
          $xml = Join-Path $cov 'logic.xml'
          $oc = Join-Path $env:ProgramFiles 'OpenCppCoverage\OpenCppCoverage.exe'
          $exe = Join-Path $root 'app\build\ui_logic_tests.exe'
          if (-not (Test-Path $exe)) { throw 'ui_logic_tests.exe not found: app\build.ps1 did not build it' }
          # OpenCppCoverage returns the exit code of the measured program. The
          # tests are headless (no audio device), so a non-zero code fails the
          # step instead of being dismissed as a warning.
          $ErrorActionPreference = 'Continue'
          $output = & $oc --modules "$root\app\build\ui_logic_tests*" --sources "$root\app\src*" --export_type "cobertura:$xml" -- $exe 2>&1
          $tests = $LASTEXITCODE
          $output
          $ErrorActionPreference = 'Stop'
          if ($tests -ne 0) { throw "ui_logic_tests reported $tests failures" }
          if (-not (Test-Path $xml)) { throw 'coverage report was not written' }

      # Coverage for SonarQube: the core tools run under OpenCppCoverage
      # against synthetic BRSTM inputs (no audio device needed). Each
      # invocation is checked against its expected exit code; a mismatch
      # fails the step. Each run exports its own Cobertura XML.
      - name: Measure coverage of core tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $cov = Join-Path $root 'coverage'
          New-Item -ItemType Directory -Force -Path $cov | Out-Null

          $env:MKW_SETTINGS_DIR = Join-Path $cov 'settings'
          $oc = Join-Path $env:ProgramFiles 'OpenCppCoverage\OpenCppCoverage.exe'

          # Synthetic inputs: stereo and quad (valid), plus a file that must be rejected.
          # make_synthetic_brstm.exe is built by the selftest step above.
          $gen = Join-Path $cov 'make_synthetic_brstm.exe'
          if (-not (Test-Path $gen)) { throw 'make_synthetic_brstm.exe not found: the selftest step builds it' }
          $stereo = Join-Path $cov 'stereo.brstm'
          $quad = Join-Path $cov 'quad.brstm'
          $bad = Join-Path $cov 'bad.brstm'
          & $gen $stereo 2 0 40
          & $gen $quad 4 0 40
          [IO.File]::WriteAllBytes($bad, [byte[]](0, 1, 2, 3))

          $info  = Join-Path $root 'core\build\brstm_info.exe'
          $decode= Join-Path $root 'core\build\brstm_decode.exe'
          $chans = Join-Path $root 'core\build\brstm_channels.exe'
          foreach ($e in @($info,$decode,$chans)) {
              if (-not (Test-Path $e)) { throw "$e not found: core\build.ps1 did not build it" }
          }

          # Run one tool under OpenCppCoverage, export Cobertura XML, and assert
          # the exit code matches the expected value. OpenCppCoverage returns the
          # measured program's exit code, so read it without Stop masking it.
          function Invoke-CoreTool {
              param($Exe, [string[]]$ToolArgs, $Xml, $Expected)
              # Start-Process does not inherit this step's $ErrorActionPreference,
              # so the measured program's exit code is only compared, never thrown.
              $proc = Start-Process -FilePath $oc -NoNewWindow -Wait -PassThru -ArgumentList (@(
                  '--modules', "$root\core\build*",
                  '--sources', "$root\core\src*",
                  '--export_type', "cobertura:$Xml",
                  '--', $Exe) + $ToolArgs)
              $code = $proc.ExitCode
              if ($code -ne $Expected) { throw "$Exe $($ToolArgs -join ' ') exited $code, expected $Expected" }
              if (-not (Test-Path $Xml)) { throw "coverage report $Xml was not written" }
          }

          # brstm_info: valid file -> exit 0, invalid file -> exit 2.
          Invoke-CoreTool $info @($stereo) "$cov\core-info.xml" 0
          Invoke-CoreTool $info @($bad) "$cov\core-info-invalid.xml" 2
          # brstm_decode: valid file -> exit 0, invalid file -> exit 2.
          $wav = Join-Path $cov 'decode.wav'
          Invoke-CoreTool $decode @($stereo, $wav) "$cov\core-decode.xml" 0
          Invoke-CoreTool $decode @($bad, "$cov\decode-bad.wav") "$cov\core-decode-invalid.xml" 2
          # brstm_channels: valid file -> exit 0. On invalid input the tool
          # returns 1 (open failure), not 2 as the task states; since
          # core/tools must not be changed, the step asserts the actual code 1.
          Invoke-CoreTool $chans @($stereo) "$cov\core-channels.xml" 0
          Invoke-CoreTool $chans @($bad) "$cov\core-channels-invalid.xml" 1

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.cobertura.reportPaths=coverage/coverage.xml,coverage/logic.xml,coverage/core-info.xml,coverage/core-info-invalid.xml,coverage/core-decode.xml,coverage/core-decode-invalid.xml,coverage/core-channels.xml,coverage/core-channels-invalid.xml

      - name: Remove build intermediates
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.obj,*.pdb,*.ilk -File -ErrorAction SilentlyContinue | Remove-Item -Force
