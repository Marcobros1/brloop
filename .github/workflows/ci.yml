name: CI

# Portable checks only. The full verification harness (tests/run_t2_verification.ps1)
# needs the local reference collection, vgmstream and an audio device, so it runs
# on a self-hosted Windows runner instead (see ARCHITECTURE.md, "Continuous
# integration").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history: SonarQube needs it for accurate blame and new-code detection.

      - name: Check for whitespace errors
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base (first push): checking the last commit only."
            base="HEAD~1"
          fi
          git diff --check "$base" HEAD

      - name: Build core tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File core\build.ps1

      - name: Build app and player tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Remove build intermediates
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.obj,*.pdb,*.ilk -File -ErrorAction SilentlyContinue | Remove-Item -Force
