name: CI

# Portable checks only. The full verification harness (tests/run_t2_verification.ps1)
# needs the local reference collection, vgmstream and an audio device, so it runs
# on a self-hosted Windows runner instead (see ARCHITECTURE.md, "Continuous
# integration").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history: SonarQube needs it for accurate blame and new-code detection.

      - name: Check for whitespace errors
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base (first push): checking the last commit only."
            base="HEAD~1"
          fi
          git diff --check "$base" HEAD

      - name: Build core tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File core\build.ps1

      - name: Build app and player tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1

      # Coverage for SonarQube: the window self-test runs against a synthetic
      # BRSTM (no reference collection needed) under OpenCppCoverage, which
      # exports Cobertura XML. The PDB comes from a separate debug build so that
      # app\build (the shipped binary) stays unchanged.
      - name: Install OpenCppCoverage
        shell: pwsh
        run: choco install opencppcoverage --version 0.9.9 -y --no-progress

      - name: Measure coverage of the window self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $cov = Join-Path $root 'coverage'
          New-Item -ItemType Directory -Force -Path $cov | Out-Null

          # Debug build with PDB, same sources and flags as app\build.ps1.
          $dbg = Join-Path $cov 'debug'
          New-Item -ItemType Directory -Force -Path $dbg | Out-Null
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $cov 'debug.bat'
          $srcFiles = @(
            'core\src\brstm.c', 'core\src\dsp_adpcm.c', 'app\src\player.c', 'app\src\audio_out.c',
            'app\src\cli_options.c', 'app\src\library.c', 'app\src\transport.c', 'app\src\resampler.c',
            'app\src\strings.c', 'app\src\settings.c', 'app\src\ui_selftest.c', 'app\src\icons.c',
            'app\src\main.c'
          ) | ForEach-Object { '"' + (Join-Path $root $_) + '"' }
          $srcArgs = $srcFiles -join ' '
          @(
            '@echo off',
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1",
            'if errorlevel 1 exit /b 1',
            "cd /d `"$dbg`"",
            "rc /nologo /fo brloop.res `"$root\app\src\brloop.rc`"",
            "cl /nologo /W4 /WX /O2 /Zi /utf-8 /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE /I`"$root\core\include`" /I`"$root\app\include`" $srcArgs brloop.res /Fe:brloop.exe /Fd:brloop.pdb /link user32.lib gdi32.lib shell32.lib winmm.lib comctl32.lib comdlg32.lib psapi.lib",
            'exit /b %errorlevel%'
          ) | Set-Content -Path $bat -Encoding Ascii
          cmd /c "`"$bat`""
          if ($LASTEXITCODE -ne 0) { throw "debug build failed ($LASTEXITCODE)" }

          # The UI font is loaded from assets\fonts next to the executable.
          New-Item -ItemType Directory -Force -Path (Join-Path $dbg 'assets\fonts') | Out-Null
          Copy-Item -Path (Join-Path $root 'app\assets\fonts\*') -Destination (Join-Path $dbg 'assets\fonts') -Force

          # Synthetic inputs: a stereo track and a 4-channel track, plus a file that must be rejected.
          $gen = Join-Path $cov 'make_synthetic_brstm.exe'
          $genBat = Join-Path $cov 'generator.bat'
          @(
            '@echo off',
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1",
            'if errorlevel 1 exit /b 1',
            "cl /nologo /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS `"$root\core\tests\make_synthetic_brstm.c`" /Fe:`"$gen`" >nul",
            'exit /b %errorlevel%'
          ) | Set-Content -Path $genBat -Encoding Ascii
          cmd /c "`"$genBat`""
          if ($LASTEXITCODE -ne 0) { throw "generator build failed ($LASTEXITCODE)" }
          $stereo = Join-Path $cov 'stereo.brstm'
          $quad = Join-Path $cov 'quad.brstm'
          $bad = Join-Path $cov 'bad.brstm'
          & $gen $stereo 2 0 40
          & $gen $quad 4 0 40
          [IO.File]::WriteAllBytes($bad, [byte[]](0, 1, 2, 3))

          $env:MKW_SETTINGS_DIR = Join-Path $cov 'settings'
          # The runner has no sound card: run the audio path with silence.
          $env:MKW_SILENT_AUDIO = '1'
          $report = Join-Path $cov 'selftest.txt'
          $xml = Join-Path $cov 'coverage.xml'
          $oc = Join-Path $env:ProgramFiles 'OpenCppCoverage\OpenCppCoverage.exe'
          & $oc --modules "$dbg*" --sources "$root\app\src*" --export_type "cobertura:$xml" -- (Join-Path $dbg 'brloop.exe') --selftest $stereo $quad --invalid $bad --report $report
          $selftest = $LASTEXITCODE
          # Print the whole report so a failing check is visible in the log.
          Get-Content $report
          if ($selftest -ne 0) { throw "window self-test failed ($selftest)" }
          if (-not (Test-Path $xml)) { throw 'coverage report was not written' }

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.cobertura.reportPaths=coverage/coverage.xml

      - name: Remove build intermediates
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.obj,*.pdb,*.ilk -File -ErrorAction SilentlyContinue | Remove-Item -Force
