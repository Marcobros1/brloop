name: Release

# Builds the release zip from a version tag on a fixed runner, so the published
# binary comes from the reviewed commit and not from a local machine.
# The tag must point to a commit already on main (see the check below).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # sign the build provenance attestation
      attestations: write    # store the attestation with the artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the tag points to main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag commit is not on main. Release refused."
            exit 1
          fi

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build core tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File core\build.ps1

      - name: Build app and player tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1

      - name: Package the release zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\make_release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Compute SHA-256
        id: hash
        shell: bash
        run: |
          zip="dist/BRLoop-${{ steps.version.outputs.version }}-win64.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.hash.outputs.zip }}

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Built by CI from commit ${GITHUB_SHA} on main.

          SHA-256 of $(basename "${{ steps.hash.outputs.zip }}"): ${{ steps.hash.outputs.sha }}

          Build provenance is attested by GitHub Actions; verify with
          \`gh attestation verify <zip> --repo ${GITHUB_REPOSITORY}\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "${{ steps.hash.outputs.zip }}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "BRLoop $GITHUB_REF_NAME" \
            --notes-file notes.md
