name: Release

# Builds the release zip from a version tag on a fixed runner, so the published
# binary comes from the reviewed commit and not from a local machine.
# The tag must point to a commit already on main (see the check below).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # sign the build provenance attestation
      attestations: write    # store the attestation with the artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the tag points to main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag commit is not on main. Release refused."
            exit 1
          fi

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check the version files match the tag
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          # The tag commit must already carry this version: the workflow never
          # writes it, so the binary comes from the reviewed commit on main.
          fail=0
          check() {
            if ! grep -q -- "$2" "$1"; then
              echo "::error file=$1::Version $v is missing here: expected $2"
              fail=1
            fi
          }
          check app/src/brloop.rc "VALUE \"FileVersion\", \"$v\""
          check app/src/brloop.rc "VALUE \"ProductVersion\", \"$v\""
          check app/src/brloop.rc "FILEVERSION ${v//./,},0"
          check app/src/brloop.rc "PRODUCTVERSION ${v//./,},0"
          check app/src/brloop.manifest "version=\"$v.0\""
          check sonar-project.properties "sonar.projectVersion=$v"
          exit $fail

      - name: Build core tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File core\build.ps1

      - name: Build app and player tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1

      - name: Package the release zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\make_release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Compute SHA-256
        id: hash
        shell: bash
        run: |
          zip="dist/BRLoop-${{ steps.version.outputs.version }}-win64.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.hash.outputs.zip }}

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the previous version tag to build a changelog
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git tag --sort=-v:refname | grep '^v' | grep -v "$GITHUB_REF_NAME" | head -n1)

          cat > notes.md <<EOF
          # BRLoop $GITHUB_REF_NAME

          Built by CI from commit ${GITHUB_SHA} on main.
          EOF

          # Optional custom notes per version: docs/release_notes/<version>.md
          version="${{ steps.version.outputs.version }}"
          custom="docs/release_notes/${version}.md"
          if [ -f "$custom" ]; then
            echo "" >> notes.md
            echo "## Notes" >> notes.md
            cat "$custom" >> notes.md
            echo "" >> notes.md
          fi

          if [ -n "$prev_tag" ]; then
            echo "## Changes since $prev_tag" >> notes.md
            git log ${prev_tag}..HEAD --pretty=format:"- %s" >> notes.md
          else
            echo "## Changes" >> notes.md
            git log --pretty=format:"- %s" >> notes.md
          fi
          echo "" >> notes.md

          cat >> notes.md <<EOF
          SHA-256 of $(basename "${{ steps.hash.outputs.zip }}"): ${{ steps.hash.outputs.sha }}

          Build provenance is attested by GitHub Actions; verify with
          \`gh attestation verify <zip> --repo ${GITHUB_REPOSITORY}\`.
          EOF

          gh release create "$GITHUB_REF_NAME" "${{ steps.hash.outputs.zip }}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "BRLoop $GITHUB_REF_NAME" \
            --notes-file notes.md
